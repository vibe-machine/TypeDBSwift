[task_config]
includes = [".mise/tasks"]

[tasks.build]
alias = "b"
description = "Build the Swift package"
run = "./scripts/build.sh"

[tasks.test]
alias = "t"
description = "Run tests (--unit, --integration, --coverage)"
run = "./scripts/test.sh {{arg(name='flags', var=true)}}"

[tasks."fetch-driver"]
alias = "fd"
description = "Fetch pre-built C driver"
run = "./scripts/fetch-driver.sh"

[tasks.release]
alias = "r"
description = "Tag a release: mise run release <version>"
file = ".mise/tasks/release.sh"
